# CI for the STEMGeoHS Marine Earth Engine script.
#
# WHAT THIS CAN AND CANNOT COVER. The tool runs in the Google Earth Engine Code
# Editor against an authenticated account, which CI has no access to, so nothing
# that depends on a real reduceRegions/evaluate result is tested here and nothing
# here should be read as saying the Earth Engine paths work. What it does cover
# is the part that is plain JavaScript and has repeatedly broken in the past:
#   - the file failing to parse at all,
#   - a ReferenceError at load (v10.164 shipped one that broke FIND SWEET SPOT),
#   - ES6 that the Code Editor rejects at RUNTIME but node --check accepts
#     (v10.149 String.repeat, v10.158 Object.assign - both browser-only failures),
#   - the statistics, the score guards, and whether click handlers are wired.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Parse, ES5 subset and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every snapshot at the repo root must parse, not just the live file - a
      # historical copy that no longer parses is a broken artifact in the repo
      # even if nobody pastes it into the Code Editor today. All four parse as
      # of v10.174. No dependencies are installed: the suite has none on purpose,
      # so CI cannot break on an unrelated registry outage.
      - name: node --check every tool snapshot
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(GeoMarineAnalysisV10_*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No GeoMarineAnalysisV10_*.js found at the repo root."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Smoke tests (stub harness)
        run: node tests/ci.js

      # Study scripts under studies/ are ALSO Earth Engine Code Editor code and
      # carry the same ES5-only constraint as the main tool. node --check cannot
      # catch ES6 methods (they parse fine and fail in the browser), so the same
      # scanner runs over them. Added with the SB02 vessel-proxy study.
      - name: ES5 gate over study GEE scripts
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(studies/**/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No study .js files found - nothing to scan."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "checking $f"
            node --check "$f"
            node -e "
              var es5 = require('./tests/es5.js');
              var src = require('fs').readFileSync(process.argv[1], 'utf8');
              var hits = es5.scan(src);
              if (hits.length) {
                console.error('ES6 constructs found in ' + process.argv[1] + ':');
                hits.slice(0, 20).forEach(function (h) {
                  console.error('  line ' + h.line + ': ' + h.rule);
                });
                process.exit(1);
              }
              console.log('  ES5 clean');
            " "$f"
          done

      # The offline analysis scripts carry their own self-tests. They have no
      # third-party dependencies, so this stays a zero-install job.
      - name: Study self-tests (Python)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in studies/sb02-vessel-proxy/acoustic_label.py studies/sb02-vessel-proxy/flag_ambiguities.py; do
            [ -f "$f" ] || continue
            echo "running $f"
            out="$(python3 "$f")"
            echo "$out"
            echo "$out" | grep -qE 'all (property |self-)tests passed' || {
              echo "SELF-TESTS DID NOT PASS in $f"; exit 1; }
          done
